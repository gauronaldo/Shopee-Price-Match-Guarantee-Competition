[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "shopee-multimodal-product-matching"
version = "0.1.0"
description = "Leakage-safe multimodal product deduplication and catalog entity resolution"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "PyYAML==6.0.2",
  "torch==2.7.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
  "types-PyYAML==6.0.12.20250516",
]
eda = [
  "ipykernel==7.3.0",
  "jupyterlab==4.6.2",
  "matplotlib==3.11.1",
]
retrieval = [
  "faiss-cpu==1.15.0",
]
pretrained = [
  "torchvision==0.22.0",
]
demo = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "streamlit==1.48.1",
  "uvicorn==0.35.0",
]

[project.scripts]
shopee-data = "shopee_match.data.cli:main"
shopee-benchmark = "shopee_match.evaluation.cli:main"
shopee-image = "shopee_match.training.cli:main"
shopee-hard-negatives = "shopee_match.training.hard_negative_cli:main"
shopee-multimodal = "shopee_match.training.multimodal_cli:main"
shopee-retrieval = "shopee_match.retrieval.cli:main"
shopee-entity-resolution = "shopee_match.clustering.cli:main"
shopee-text = "shopee_match.training.text_cli:main"
shopee-smoke = "shopee_match.smoke:main"
shopee-pretrained = "shopee_match.evaluation.pretrained_cli:main"
shopee-final = "shopee_match.evaluation.final_cli:main"
shopee-demo = "shopee_match.serving.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shopee_match"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["shopee_match"]
