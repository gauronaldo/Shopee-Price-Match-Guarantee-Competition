config_version: phase4.text_embedding_experiment.v1
seed: 2026
data:
  metadata_csv: data/raw/train.csv
  split_manifest: data/splits/shopee_group_split_v1.jsonl
model_config: configs/model/custom_character_text_cnn.yaml
tokenization:
  level: character
  normalization: nfkc_casefold_identity_preserving
  maximum_length: 128
  minimum_frequency: 2
  maximum_vocabulary_size: 512
training:
  device: auto
  epochs: 12
  products_per_batch: 16
  samples_per_product: 2
  batches_per_epoch: 100
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0001
  temperature: 0.07
  gradient_clip_norm: 5.0
  minimum_learning_rate: 0.00001
  early_stopping_patience: 4
  deterministic: true
evaluation:
  tune_split: validation
  final_split: test
  evaluate_test: false
  candidate_pool: full_split
  exclude_query_itself: true
  recall_at: [1, 5, 10, 20]
  average_precision_at: 20
  candidate_k: 20
  checkpoint_metric: map@20
artifacts:
  root: artifacts/scratch_text_encoder/pilot
  report: artifacts/scratch_text_encoder/pilot/report.md
